<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>일정 상세 · 드림 캘린더</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1b1f27; --sub: #5b6475; --line: #e6e9f0;
    --accent: #3f6fd8; --accent-text: #ffffff; --soft: #eef2fb; --event: #4285f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --card: #1d2027; --text: #eef0f4; --sub: #a3abba; --line: #2c313b;
      --accent: #7fa2f0; --accent-text: #0f1420; --soft: #252a35;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 20px 20px 8px; font-size: 15px; color: var(--sub); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  main { flex: 1; padding: 8px 16px 24px; max-width: 560px; width: 100%; margin: 0 auto; }
  .card { background: var(--card); border-radius: 20px; padding: 24px 22px; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-top: 6px solid var(--event); }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 20px; word-break: keep-all; overflow-wrap: anywhere; }
  .row { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); align-items: flex-start; }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .icon { width: 28px; flex: none; font-size: 22px; line-height: 1.4; text-align: center; }
  .label { font-size: 14px; color: var(--sub); margin-bottom: 2px; }
  .value { font-size: 20px; font-weight: 500; word-break: keep-all; overflow-wrap: anywhere; }
  .memo { white-space: pre-wrap; font-size: 18px; font-weight: 400; }
  .actions { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 58px; border-radius: 16px; font-size: 19px; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.secondary { background: var(--soft); color: var(--text); }
  .note { font-size: 15px; color: var(--sub); text-align: center; margin: 4px 0 0; }
  .center { text-align: center; padding: 60px 20px; color: var(--sub); font-size: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>📅 드림 캘린더</header>
<main>
  <div id="status" class="center">불러오는 중…</div>
  <article id="card" class="card hidden">
    <h1 id="title"></h1>
    <div class="row"><div class="icon">🕒</div><div><div class="label">시간</div><div class="value" id="when"></div></div></div>
    <div class="row hidden" id="repeatRow"><div class="icon">🔁</div><div><div class="label">반복</div><div class="value" id="repeat"></div></div></div>
    <div class="row hidden" id="locationRow"><div class="icon">📍</div><div><div class="label">장소</div><div class="value" id="location"></div></div></div>
    <div class="row hidden" id="calendarRow"><div class="icon">🗂</div><div><div class="label">캘린더</div><div class="value" id="calendar"></div></div></div>
    <div class="row hidden" id="memoRow"><div class="icon">📝</div><div><div class="label">메모</div><div class="value memo" id="memo"></div></div></div>
  </article>
</main>
<div class="actions hidden" id="actions">
  <a class="btn primary" id="openApp" href="#">📱 앱에서 열기</a>
  <a class="btn secondary hidden" id="openMap" href="#" target="_blank" rel="noopener">🗺 지도에서 보기</a>
  <p class="note hidden" id="noApp">앱이 설치되어 있지 않아 웹에서 보여드리고 있어요.</p>
</div>
<script>
  const SUPABASE_URL = "https://bsuwflqkrpydkapixjmz.supabase.co";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const id = params.get("id") || "";
  const at = params.get("at") || "";

  function show(rowId, valueId, text) {
    if (!text) return;
    $(valueId).textContent = text;
    $(rowId).classList.remove("hidden");
  }

  function appLink() {
    const q = `id=${encodeURIComponent(id)}&at=${encodeURIComponent(at)}`;
    if (/android/i.test(navigator.userAgent)) {
      // 앱이 없으면 이 페이지로 돌아오면서 안내 문구 표시
      const fallback = location.origin + location.pathname + "?" + q + "&noapp=1";
      return `intent://event?${q}#Intent;scheme=wooricalendar;` +
        `S.browser_fallback_url=${encodeURIComponent(fallback)};end`;
    }
    return `wooricalendar://event?${q}`;
  }

  async function load() {
    if (!id) { $("status").textContent = "일정 정보가 없습니다."; return; }
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/event-view?format=json&id=${encodeURIComponent(id)}&at=${encodeURIComponent(at)}`);
      if (res.status === 404) { $("status").textContent = "삭제되었거나 찾을 수 없는 일정입니다."; return; }
      if (!res.ok) throw new Error(res.status);
      const ev = await res.json();
      document.title = `${ev.title} · 드림 캘린더`;
      if (ev.color) document.documentElement.style.setProperty("--event", ev.color);
      $("title").textContent = ev.title;
      $("when").textContent = ev.when;
      show("repeatRow", "repeat", ev.repeat);
      show("locationRow", "location", ev.location);
      show("calendarRow", "calendar", ev.calendar);
      show("memoRow", "memo", ev.description);
      if (ev.location) {
        $("openMap").href = "https://map.naver.com/p/search/" + encodeURIComponent(ev.location);
        $("openMap").classList.remove("hidden");
      }
      $("openApp").href = appLink();
      if (params.get("noapp") === "1") $("noApp").classList.remove("hidden");
      $("status").classList.add("hidden");
      $("card").classList.remove("hidden");
      $("actions").classList.remove("hidden");
    } catch (e) {
      $("status").textContent = "일정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
    }
  }
  load();
</script>
</body>
</html>
