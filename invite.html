<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>캘린더 초대 · 드림 캘린더</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1b1f27; --sub: #5b6475; --line: #e6e9f0;
    --accent: #3f6fd8; --accent-text: #ffffff; --soft: #eef2fb; --cal: #3f6fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --card: #1d2027; --text: #eef0f4; --sub: #a3abba; --line: #2c313b;
      --accent: #7fa2f0; --accent-text: #0f1420; --soft: #252a35;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font: 18px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 40px; }
  .brand { text-align: center; color: var(--sub); font-weight: 600; font-size: 15px; margin-bottom: 20px; }
  .card { background: var(--card); border-radius: 22px; padding: 32px 24px 28px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .badge { width: 72px; height: 72px; border-radius: 20px; background: var(--cal); color: #fff; font-size: 36px; display: grid; place-items: center; margin: 0 auto 18px; }
  .from { color: var(--sub); font-size: 17px; margin: 0; }
  h1 { font-size: 27px; line-height: 1.3; margin: 6px 0 4px; word-break: keep-all; overflow-wrap: anywhere; }
  .role { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; background: var(--soft); font-size: 15px; font-weight: 600; }
  .btn { display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 16px; font-size: 19px; font-weight: 700; text-decoration: none; margin-top: 24px; background: var(--accent); color: var(--accent-text); }
  .code-box { margin-top: 22px; padding: 16px; border-radius: 16px; background: var(--soft); }
  .code-label { font-size: 14px; color: var(--sub); }
  .code { font-size: 32px; font-weight: 800; letter-spacing: 6px; margin: 2px 0 4px; user-select: all; }
  .steps { text-align: left; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 16px; color: var(--sub); }
  .steps b { color: var(--text); }
  .steps ol { padding-left: 22px; margin: 8px 0 0; }
  .steps li { margin: 6px 0; }
  .note { font-size: 15px; color: var(--sub); margin-top: 12px; }
  .center { text-align: center; padding: 60px 8px; color: var(--sub); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">📅 드림 캘린더</div>
  <div id="status" class="card center">초대장을 확인하는 중…</div>
  <div id="card" class="card hidden">
    <div class="badge">📅</div>
    <p class="from"><b id="inviter"></b>님이 초대했어요</p>
    <h1 id="calName"></h1>
    <span class="role" id="role"></span>
    <a class="btn" id="join" href="#">앱에서 참여하기</a>
    <p class="note hidden" id="noApp">앱이 설치되어 있지 않아요. 아래 방법으로 참여해 주세요.</p>
    <div class="code-box">
      <div class="code-label">초대 코드</div>
      <div class="code" id="code"></div>
      <div class="code-label" id="expires"></div>
    </div>
    <div class="steps">
      <b>앱이 열리지 않거나 PC에서 참여할 때</b>
      <ol>
        <li>드림 캘린더 앱을 설치하고 로그인 (구글 계정 가능)</li>
        <li><b>캘린더 관리 → 초대 코드로 참여하기</b></li>
        <li>위의 초대 코드 입력</li>
      </ol>
    </div>
  </div>
</main>
<script>
  const SUPABASE_URL = "https://bsuwflqkrpydkapixjmz.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_qgeBKPs3QdBxGwoRBabmGg_CY5a1Fwc";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const code = (params.get("code") || "").trim().toUpperCase();

  function appLink() {
    const q = `code=${encodeURIComponent(code)}`;
    if (/android/i.test(navigator.userAgent)) {
      const fallback = location.origin + location.pathname + "?" + q + "&noapp=1";
      return `intent://invite?${q}#Intent;scheme=wooricalendar;` +
        `S.browser_fallback_url=${encodeURIComponent(fallback)};end`;
    }
    return `wooricalendar://invite?${q}`;
  }

  async function load() {
    if (!code) { $("status").textContent = "초대 코드가 없습니다."; return; }
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/invite_info`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: PUBLISHABLE_KEY },
        body: JSON.stringify({ p_code: code }),
      });
      if (!res.ok) throw new Error(res.status);
      const rows = await res.json();
      if (!rows.length) { $("status").textContent = "초대 링크가 만료되었거나 올바르지 않아요. 초대한 분께 새 링크를 요청해 주세요."; return; }
      const inv = rows[0];
      const color = "#" + (Number(inv.calendar_color) & 0xffffff).toString(16).padStart(6, "0");
      document.documentElement.style.setProperty("--cal", color);
      document.title = `${inv.calendar_name} 초대 · 드림 캘린더`;
      $("inviter").textContent = inv.inviter_name || "누군가";
      $("calName").textContent = `"${inv.calendar_name}" 캘린더`;
      $("role").textContent = inv.role === "editor" ? "함께 보고 편집하기" : "일정 보기";
      $("code").textContent = code;
      const exp = new Date(inv.expires_at);
      $("expires").textContent = `${exp.getMonth() + 1}월 ${exp.getDate()}일까지 사용 가능`;
      $("join").href = appLink();
      if (params.get("noapp") === "1") $("noApp").classList.remove("hidden");
      $("status").classList.add("hidden");
      $("card").classList.remove("hidden");
    } catch (e) {
      $("status").textContent = "초대장을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
    }
  }
  load();
</script>
</body>
</html>
